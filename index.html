<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>&#123;&#125; Prompt Library</h1>
    <p>Save and manage your AI prompts</p>
  </header>

  <main>
    <section class="form-section">
      <h2>New Prompt</h2>
      <form id="prompt-form">
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" placeholder="e.g. Refactor function" required />
        </div>
        <div class="field">
          <label for="model">Model</label>
          <input type="text" id="model" placeholder="e.g. gpt-4o, claude-sonnet-4-6" required maxlength="100" />
        </div>
        <div class="field">
          <label for="content">Prompt Content</label>
          <textarea id="content" rows="5" placeholder="Enter your prompt here..." required></textarea>
        </div>
        <button type="submit">Save Prompt</button>
      </form>
    </section>

    <section class="library-section">
      <h2>Saved Prompts <span id="count"></span></h2>
      <div id="prompt-grid" class="prompt-grid"></div>
      <p id="empty-state" class="empty-state">No prompts saved yet. Add one above.</p>
    </section>
  </main>

  <div id="prompt-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <header class="modal-header">
        <div class="modal-heading">
          <h3 id="modal-title"></h3>
          <div id="modal-meta" class="modal-meta"></div>
        </div>
        <button type="button" class="modal-close" data-close aria-label="Close">&times;</button>
      </header>

      <div class="modal-body">
        <section class="modal-section">
          <div class="modal-section-head">
            <span class="modal-section-label">Prompt</span>
            <button type="button" id="copy-btn" class="copy-btn">Copy prompt</button>
          </div>
          <pre id="modal-content" class="modal-prompt" tabindex="0"></pre>
        </section>

        <section class="modal-section">
          <div class="modal-section-head">
            <span class="modal-section-label">Notes <span id="modal-note-count" class="note-count"></span></span>
          </div>
          <div class="notes-body">
            <div id="modal-notes-list" class="notes-list"></div>
            <textarea id="modal-note-input" class="note-input" placeholder="Add a note... (Enter to save)"></textarea>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
